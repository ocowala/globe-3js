<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Globe Portfolio</title>



  <link rel="stylesheet" href="./styles.css">


  <!-- Preload font and JS module tree before anything else -->
  <link rel="preload" as="font" href="/InstrumentSerif-Regular.ttf" crossorigin>
  <link rel="modulepreload" href="/src/main.js">

  <!-- Preload all GLB assets so the browser downloads them in parallel before JS executes -->
  <link rel="preload" as="fetch" crossorigin="anonymous" href="/assets/models/city_at_night_v4_meshopt.glb">
  <link rel="preload" as="fetch" crossorigin="anonymous" href="/assets/models/motorcycle.glb">
  <link rel="preload" as="fetch" crossorigin="anonymous" href="/assets/models/school_v2_meshopt.glb">
  <link rel="preload" as="fetch" crossorigin="anonymous" href="/assets/models/airplane.glb">
  <link rel="preload" as="fetch" crossorigin="anonymous" href="/assets/models/desert_meshopt.glb">
  <link rel="preload" as="fetch" crossorigin="anonymous" href="/assets/models/bronco.glb">
  <link rel="preload" as="fetch" crossorigin="anonymous" href="/assets/models/beach_v2_meshopt.glb">
  <link rel="preload" as="fetch" crossorigin="anonymous" href="/assets/models/boat.glb">
  <link rel="preload" as="fetch" crossorigin="anonymous" href="/assets/models/landscape_v5_meshopt.glb">
  <link rel="preload" as="fetch" crossorigin="anonymous" href="/assets/models/car_v2.glb">
  <link rel="preload" as="fetch" crossorigin="anonymous" href="/assets/models/cafe_meshopt.glb">
  <link rel="preload" as="fetch" crossorigin="anonymous" href="/assets/models/sls_amg_63_black_series.glb">
</head>

<body class="theme-clay preloader-layout">
  <!-- Video/Audio Overlay -->
  <div id="video-overlay">
    <video id="movie-video" playsinline muted></video>
    <audio id="movie-audio" src="/castle.mp3" preload="auto"></audio>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <!-- Left panel: Monospace terminal UI -->
    <div class="preloader-panel terminal-panel">
      <div class="terminal-header">
        <div class="terminal-dot red"></div>
        <div class="terminal-dot yellow"></div>
        <div class="terminal-dot green"></div>
        <span class="terminal-title">bash</span>
      </div>
      <div class="terminal-body" id="terminal-body"></div>
    </div>
    
    <!-- Right panel: HUD and telemetry readout -->
    <div class="preloader-panel rocket-panel">
      <div class="telemetry-box">
        <div class="telemetry-row">
          <span class="telemetry-label">SPEED</span>
          <span class="telemetry-value" id="telemetry-speed">0.00 km/s</span>
        </div>
        <div class="telemetry-row">
          <span class="telemetry-label">ALTITUDE</span>
          <span class="telemetry-value" id="telemetry-alt">124.0 km</span>
        </div>
        <div class="telemetry-row">
          <span class="telemetry-label">TIMER</span>
          <span class="telemetry-value" id="telemetry-time">0.0s</span>
        </div>
      </div>
    </div>
  </div>

  <div class="social-links">
    <a href="https://github.com" target="_blank" rel="noopener noreferrer" title="GitHub">
      <img src="/github.png" alt="GitHub" class="social-icon">
    </a>
    <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" title="LinkedIn">
      <img src="/linkedin.png" alt="LinkedIn" class="social-icon">
    </a>
    <div class="info-container">
      <button class="info-btn" aria-label="Show controls instructions">i</button>
      <div class="info-tooltip">
        <div class="info-row"><span class="key">← →</span> browse</div>
        <div class="info-row"><span class="key">enter</span> focus</div>
        <div class="info-row"><span class="key">space</span> pause</div>
        <div class="info-row"><span class="key">esc</span> menu</div>
      </div>
      <div id="info-hint" class="info-hint">← click me</div>
    </div>
    <button id="movie-btn" class="movie-btn" aria-label="Play movie">
      <img src="/camera.png" alt="Play Movie">
    </button>
  </div>

  <div id="app">


    <div id="canvas-container"></div>

    <audio id="bg-audio" crossorigin="anonymous" preload="auto" loop></audio>
    <span id="audio-toggle" title="Toggle Audio" aria-label="Toggle Audio">
      <span class="music-emoji">🎶</span>
      <div id="audio-visualizer" class="audio-visualizer">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
      <span id="song-name"></span>
    </span>

    <!-- Backdrop Mode Selector Button -->
    <button id="theme-toggle" class="theme-toggle" title="Backdrop: Day-Night Cycle" aria-label="Toggle Backdrop Mode">
      <span class="theme-emoji">🌗</span>
    </button>

    <!-- Radial Navigation Wheel (primarily for iPhone/iPad & desktop) -->
    <div id="radial-nav" class="radial-nav">
      <div class="radial-wheel">
        <button class="radial-node node-0" data-idx="0" title="Resume" style="background:#f7c5c0"></button>
        <button class="radial-node node-1" data-idx="1" title="School" style="background:#c7b8ea"></button>
        <button class="radial-node node-2" data-idx="2" title="Skills" style="background:#fce8a3"></button>
        <button class="radial-node node-3" data-idx="3" title="Experience" style="background:#b8e6c8"></button>
        <button class="radial-node node-4" data-idx="4" title="Projects" style="background:#ffd8b1"></button>
        <button class="radial-node node-5" data-idx="5" title="Hobbies" style="background:#a8d8ea"></button>
        <div class="radial-center">
          <span class="radial-arrow">↑</span>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
